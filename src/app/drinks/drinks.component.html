<div *ngIf="loading">Loading drinks...</div>
<div *ngIf="!loading && drinks.length > 0">
  <h2>Available Drinks</h2>
  <ul>
    <li *ngFor="let drink of drinks">
      {{ drink.name }} - ${{ drink.price }}
    </li>
  </ul>
</div>
<div *ngIf="!loading && drinks.length === 0">
  <p>No drinks available.</p>
</div>

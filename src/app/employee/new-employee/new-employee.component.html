<div class="container">
    <h1>Add New Employee</h1>
  
    <form [formGroup]="employeeForm" (ngSubmit)="AddNewEmployeeSubmit()">
      <label for="name">Name:</label>
      <input type="text" id="name" formControlName="name" required>
      <div *ngIf="employeeForm.get('name')?.invalid && employeeForm.get('name')?.touched">
        <small *ngIf="employeeForm.get('name')?.errors?.['required']">Name is required.</small>
      </div>
      <br><br>
  
      <label for="salary">Salary:</label>
      <input type="number" id="salary" formControlName="salary" required>
      <div *ngIf="employeeForm.get('salary')?.invalid && employeeForm.get('salary')?.touched">
        <small *ngIf="employeeForm.get('salary')?.errors?.['required']">Salary is required.</small>
        <small *ngIf="employeeForm.get('salary')?.errors?.['min']">Salary must be greater than 0.</small>
      </div>
      <br><br>
  
      <label for="position">Position:</label>
      <input type="text" id="position" formControlName="position" required>
      <div *ngIf="employeeForm.get('position')?.invalid && employeeForm.get('position')?.touched">
        <small *ngIf="employeeForm.get('position')?.errors?.['required']">Position is required.</small>
      </div>
      <br><br>
  
      <label for="shift">Shift:</label>
      <input type="text" id="shift" formControlName="shift" required>
      <div *ngIf="employeeForm.get('shift')?.invalid && employeeForm.get('shift')?.touched">
        <small *ngIf="employeeForm.get('shift')?.errors?.['required']">Shift is required.</small>
      </div>
      <br><br>
  
      <button type="submit" [disabled]="employeeForm.invalid">Add Employee</button>
    </form>
  </div>

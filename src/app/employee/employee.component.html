<div class="container">
  <h1>Employee Management</h1>
  <!-- Filter Section -->
  <div class="filter-section">
    <h3>Filter Employees</h3>
    <form [formGroup]="filterForm" (ngSubmit)="applyFilters()" class="filter-form">
      <div class="filter-row">
        <div class="filter-group">
          <label for="id">Employee ID</label>
          <input type="number" id="id" formControlName="id" placeholder="Filter by ID">
        </div>
        <div class="filter-group">
          <label for="name">Name</label>
          <input type="text" id="name" formControlName="name" placeholder="Filter by name">
        </div>
      </div>
      <div class="filter-row">
        <div class="filter-group">
          <label for="position">Position</label>
          <select id="position" formControlName="position">
            <option value="">All Positions</option>
            <option *ngFor="let position of positions" [value]="position">{{position}}</option>
          </select>
        </div>
        
        <div class="filter-group">
          <label for="salary">Salary Range</label>
          <select id="salary" formControlName="salary">
            <option value="">All Salaries</option>
            <option *ngFor="let range of salaryRanges" [value]="range.value">{{range.label}}</option>
          </select>
        </div>
        
        <div class="filter-group">
          <label for="shift">Shift</label>
          <select id="shift" formControlName="shift">
            <option value="">All Shifts</option>
            <option *ngFor="let shift of shifts" [value]="shift">{{shift}}</option>
          </select>
        </div>
      </div>
      
      <div class="filter-actions">
        <button type="submit" class="btn-primary">Apply Filters</button>
      </div>
    </form>
  </div>
 
  <!-- Employees Table -->
  <div *ngIf="loading" class="loading">Loading employees...</div>
  
  <div *ngIf="!loading && filteredEmployees.length === 0" class="no-results">
    No employees found matching your criteria.
  </div>

  <div *ngIf="!loading && filteredEmployees.length > 0" class="table-container">
    <div class="results-summary">
      <span class="result-count">{{ filteredEmployees.length }} employee(s) found</span>
      <span *ngIf="filterApplied" class="filter-indicator">Filters applied</span>
    </div>
    
    <table>
      <tbody>
        <tr *ngFor="let emp of filteredEmployees" (click)="setSelectedEmployee = emp">
          <td>{{ emp.id }}</td>
          <td>{{ emp.name }}</td>
          <td>{{ emp.position }}</td>
          <td>{{ emp.shift }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
